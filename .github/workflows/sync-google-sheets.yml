name: Sync activity registrations to Google Sheets

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      year:
        description: Academic year (BE)
        required: true
        default: '2569'
        type: string

permissions:
  contents: read

concurrency:
  group: activity-google-sheet-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install protected sync dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests google-api-python-client google-auth
      - name: Sync Supabase registrations to native Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://jmlcsrmrtghmnpdpfdcf.supabase.co
        run: python scripts/sync-google-sheets.py --year '${{ inputs.year || '2569' }}'
