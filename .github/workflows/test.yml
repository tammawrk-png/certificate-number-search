name: Validate Dharma education system

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run public surface, migration, and roster policy checks
        run: node --test scripts/public-surface-smoke.mjs scripts/migration-contract.test.mjs scripts/roster-policy.test.mjs scripts/repository-safety.test.mjs
