<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Certificate search system" />
    <title>Certificate Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260814-final" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-panel"><div class="brand-mark" id="brand-mark"></div><div class="hero-copy"><p class="eyebrow" id="eyebrow"></p><h1 id="page-title"></h1><p class="hero-description" id="hero-description"></p></div><div class="hero-orb hero-orb-one"></div><div class="hero-orb hero-orb-two"></div></section>
      <section class="search-panel" aria-labelledby="search-title"><div class="section-heading"><div><p class="section-kicker" id="search-kicker"></p><h2 id="search-title"></h2></div><span class="live-pill"><span class="live-dot"></span><span id="live-label"></span></span></div><form id="search-form" class="search-form"><label class="sr-only" for="search-input" id="search-label"></label><div class="search-box"><span class="search-icon" aria-hidden="true">&#x2315;</span><input id="search-input" name="query" type="search" autocomplete="off" /><button id="clear-button" class="clear-button" type="button" hidden>&#xD7;</button></div><button class="primary-button" type="submit"><span id="search-button"></span><span aria-hidden="true">&#x2192;</span></button></form><div class="search-hints" id="search-hints"></div></section>
      <section class="info-strip" aria-label="Organization information"><div class="info-item"><span class="info-icon">&#x25CE;</span><div><small id="coordinator-label"></small><strong id="coordinator-name"></strong></div></div><div class="info-item"><span class="info-icon">&#x25A3;</span><div><small id="department-label"></small><strong id="department-name"></strong></div></div></section>
      <section class="results-section" aria-live="polite"><div class="results-toolbar"><p id="status" class="status"></p><div id="results-count" class="results-count"></div></div><div id="results" class="results-grid"></div><div id="empty-state" class="empty-state"><div class="empty-icon">&#x2315;</div><h2 id="empty-title"></h2><p id="empty-description"></p></div></section>
      <footer class="site-footer"><span id="footer-left"></span><span id="footer-right"></span></footer>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="config.js?v=20260814-final"></script>
    <script src="app.js?v=20260814-final"></script>
  </body>
</html>
