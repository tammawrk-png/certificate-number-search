<!doctype html>
<html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>ติดตามใบประกาศ · ผู้ดูแล</title><link rel="stylesheet" href="activity.css?v=20260919-1"/><style>.admin-shell{max-width:1180px;margin:auto;padding:20px 14px}.admin-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.admin-table{overflow:auto;margin-top:20px;border:1px solid #dce8e2;border-radius:14px}.admin-table table{border-collapse:collapse;width:100%;min-width:820px}.admin-table th,.admin-table td{padding:11px 12px;border-bottom:1px solid #e7efeb;text-align:left;white-space:nowrap}.admin-table th{background:#eef7f2;color:#216657}.admin-table td button{border:0;border-radius:8px;padding:7px 10px;background:#d7f5e6;color:#177245;font:inherit;font-weight:700;cursor:pointer}.admin-tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.login-card{max-width:390px;margin:90px auto}.login-card input{margin:15px 0}.muted{color:#64748b}.admin-hidden{display:none!important}</style></head>
<body><main class="admin-shell"><section id="login-card" class="panel login-card"><span class="kicker">พื้นที่ผู้ดูแล</span><h1>ใบประกาศค้างรับ</h1><p class="muted">หน้านี้แยกจากหน้าสมัครสำหรับผู้ดูแลเท่านั้น</p><form id="pin-form"><label>รหัสผ่าน<input id="pin" type="password" inputmode="numeric" autocomplete="off" required /></label><button class="button primary" type="submit">เข้าสู่หน้าแอดมิน</button><p id="pin-message" class="save-message"></p></form></section><section id="admin-workspace" class="panel admin-hidden"><div class="admin-head"><div><span class="kicker">ติดตามรายคน</span><h1>นักเรียนยังไม่รับใบประกาศ</h1><p class="muted">รหัสอ้างอิงในต้นแบบนี้ใช้สำหรับทดลองหน้าจอเท่านั้น</p></div><a class="button secondary" href="activity.html">กลับหน้าสมัคร</a></div><div class="admin-tools"><label>ค้นหา<input id="admin-search" placeholder="ชื่อ เลขประจำตัว หรือเลขใบประกาศ"/></label><label>ฟอนต์สำหรับพิมพ์<input id="font-upload" type="file" accept=".ttf,.woff,.woff2"/></label><button id="export-csv" class="button secondary" type="button">ดาวน์โหลด Excel/CSV</button><button id="print" class="button secondary" type="button">พิมพ์</button></div><div id="pickup-count" class="status">กำลังโหลด</div><div class="admin-table"><table><thead><tr><th>ชั้น/ห้อง</th><th>เลขประจำตัว</th><th>ชื่อ-นามสกุล</th><th>ระดับ</th><th>เลขใบประกาศ</th><th>สถานะ</th><th>การดำเนินการ</th></tr></thead><tbody id="pickup-body"></tbody></table></div></section></main><script src="admin-pickup.js?v=20260919-1"></script></body></html>
